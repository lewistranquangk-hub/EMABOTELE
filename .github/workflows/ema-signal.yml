name: EMA Signal Bot

on:
  # Chạy ~20 phút trước mỗi lần đóng nến H4 (0h,4h,8h,12h,16h,20h UTC)
  schedule:
    - cron: '40 23,3,7,11,15,19 * * *'
  # Cho phép bấm "Run workflow" thủ công để test
  workflow_dispatch:

# Cần quyền ghi để bot tự lưu lại "đã báo tín hiệu nào" (sent_signals.json)
# vào repo, tránh báo trùng ở lần quét sau.
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài thư viện
        run: pip install ccxt pandas requests

      - name: Chạy quét 1 lần
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Đổi thành "coinbase" nếu Binance tiếp tục bị chặn (451).
          # Lưu ý: Coinbase có rất ít altcoin nhỏ so với Binance.
          EXCHANGE_ID: "binance"
        run: python ema_signal_bot.py --once

      - name: Lưu lại trạng thái đã báo (chống báo trùng)
        run: |
          if [ -n "$(git status --porcelain sent_signals.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add sent_signals.json
            git commit -m "Cập nhật trạng thái tín hiệu đã báo [skip ci]"
            git push
          else
            echo "Không có thay đổi để lưu."
          fi
